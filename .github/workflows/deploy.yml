name: Deploy

# Manual until the first deploy has succeeded; then add `push: { branches: [main] }` here.
on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: the Terraform state in R2 is not locked, this group is the lock.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_INPUT: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Terraform init (R2 backend)
        run: terraform -chdir=terraform init -backend-config="endpoints={s3=\"https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"
      - name: Terraform plan
        run: terraform -chdir=terraform plan -out=tfplan
      - name: Terraform apply
        run: terraform -chdir=terraform apply tfplan

      - name: Render wrangler.toml with the D1 database id
        run: scripts/render-wrangler.sh "$(terraform -chdir=terraform output -raw d1_database_id)" "${{ vars.APP_ID_PREFIX_TEAM_BUNDLE }}"
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy the Worker
        run: npx wrangler deploy
